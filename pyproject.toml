[project]
name = "llm-wiki"
version = "0.1.0"
description = "基于 LLM Wiki 方法论的个人知识库工具"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "openai>=1.0",
    "anthropic>=0.40",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "pillow>=10.0",
]

[project.scripts]
llm-wiki = "llm_wiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
